<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My profile')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<!-- Teacher and student: see and edit your own info -->
<main class="container narrow">
    <h1>My profile</h1>
    <p class="muted"><span th:text="${roleLabel}">Teacher</span> account
        <code th:text="${form.username}">username</code></p>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <form th:action="@{${action}}" th:object="${form}" method="post" class="card form">
        <label>First name
            <input type="text" th:field="*{firstName}" required>
            <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
        </label>
        <label>Last name
            <input type="text" th:field="*{lastName}" required>
            <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
        </label>
        <label>Email <span class="muted">(optional)</span>
            <input type="email" th:field="*{email}">
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn">Save</button>
            <a class="btn btn-light" th:href="@{/account/password}">Change password</a>
        </div>
    </form>
</main>
</body>
</html>
