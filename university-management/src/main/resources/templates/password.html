<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Change password')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container narrow">
    <h1>Change password</h1>

    <div th:replace="~{fragments/layout :: messages}"></div>

    <form th:action="@{/account/password}" th:object="${form}" method="post" class="card form">
        <label>Current password
            <input type="password" th:field="*{currentPassword}" required>
            <span class="field-error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
        </label>
        <label>New password
            <input type="password" th:field="*{newPassword}" required>
            <span class="field-error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
        </label>
        <label>Repeat new password
            <input type="password" th:field="*{confirmPassword}" required>
            <span class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </label>

        <div class="form-actions">
            <button type="submit" class="btn">Change password</button>
        </div>
    </form>
</main>
</body>
</html>
